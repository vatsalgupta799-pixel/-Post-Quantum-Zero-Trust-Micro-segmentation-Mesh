apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: zt-integration
spec:
  selector:
    app: frontend
  ports:
    - name: https
      port: 8443
      targetPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: zt-integration
spec:
  selector:
    app: backend
  ports:
    - name: https
      port: 8443
      targetPort: 8443